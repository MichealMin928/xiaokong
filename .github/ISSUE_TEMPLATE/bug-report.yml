name: 问题反馈 / Bug report
description: 漏听、误触、点击失败或运行异常
title: "[Bug] "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "内容公开可见。请不要上传私人录音、聊天截图、序列号或完整系统日志；安全问题请使用 Security → Report a vulnerability。"
  - type: input
    id: version
    attributes:
      label: App 版本与来源
      placeholder: "例如 0.6.1-rc2，GitHub Release"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 机型与 Android 版本（不要填写序列号）
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题类型
      options: [语音漏听或误听, 手势或光标, 编号或点击, 权限与后台, 发热或耗电, 界面与其他]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤、预期和实际结果
      description: 写清操作顺序、尝试次数、成功次数及额外误触。听到指令和页面实际操作请分别说明。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 使用环境及最小诊断信息
      description: 语音模式、背景音、距离、左右手、光线，以及近期固定指令记录中的结果；不要贴完整导出文件。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已检查内容，不包含个人信息、他人记录、密钥或设备序列号。
          required: true
