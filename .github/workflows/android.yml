name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check public source and downloader safeguards
        run: |
          python3 scripts/check-public-tree.py
          python3 -m unittest discover -s scripts/tests
      - name: Install Android build packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Fetch pinned upstream artifacts
        run: |
          python3 scripts/fetch-artifacts.py --accept-model-licenses
          python3 scripts/fetch-artifacts.py --check
      - name: Tests, lint and release build
        run: ./gradlew --no-daemon -PtargetAbi=arm64-v8a :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleRelease
      - name: Verify packaged models, permissions and release boundary
        run: python3 scripts/verify-apk.py app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-*.html
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
